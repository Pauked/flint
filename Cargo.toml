[package]
name = "flint"
version = "0.2.2"
edition = "2024"
description = "Sync Kindle highlights to Obsidian"
authors = ["Paul Healey"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.9"
reqwest = { version = "0.12", features = ["cookies", "blocking", "json"] }
scraper = "0.24"
headless_chrome = "1.0"
tera = "1.20"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
fnv = "1.0"
shellexpand = "3.1"
serde_json = "1.0"
log = "0.4"
log4rs = "1.3"
